<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px system-ui, sans-serif;
        margin: 12px;
        min-width: 240px;
        max-width: 300px;
      }
      .ok {
        color: #0a7;
      }
      .bad {
        color: #c33;
      }
      code {
        font-size: 11px;
      }
      #desk {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid #ddd;
      }
      #desk[hidden] {
        display: none;
      }
      #desk p {
        margin: 0 0 8px 0;
        line-height: 1.4;
      }
      button {
        font: inherit;
        font-weight: 600;
        width: 100%;
        min-height: 32px;
        border: 1px solid #0f766e;
        border-radius: 6px;
        background: #0f766e;
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background: #fff;
        color: #0f766e;
      }
    </style>
  </head>
  <body>
    <div id="status">Checking…</div>
    <div id="desk" hidden>
      <p id="desk-text"></p>
      <button type="button" id="desk-button" hidden></button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
